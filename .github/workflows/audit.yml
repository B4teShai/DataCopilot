name: audit

# Nightly: a vulnerability published after the last merge must not wait for the next pull request.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.7"
          enable-cache: false
      - name: Export the locked runtime dependencies (core and extras, hashed)
        run: uv export --locked --no-dev --no-emit-project --all-extras --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
      - name: Known vulnerabilities in the locked versions
        env:
          PYTHON: ${{ matrix.python }}
        run: uv run --locked --group release --python "$PYTHON" pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --strict
