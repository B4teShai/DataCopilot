name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.7"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=datacopilot --cov-fail-under=85

  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.7"
      - name: The lock file is up to date with pyproject.toml
        run: uv lock --check
      - name: The core install pulls no heavy dependency
        run: uv run --locked pytest tests/release/test_core_dependencies.py -q

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.7"
          python-version: "3.12"
      - run: uv sync --locked --group docs
      - name: The CLI reference matches the application
        run: uv run python scripts/gen_cli_reference.py --check
      - name: Build the site (strict - broken links and anchors fail)
        run: uv run mkdocs build --strict --clean -d "$RUNNER_TEMP/site"
      - name: Execute the tutorial and check the built site
        run: uv run pytest tests/docs -q

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --group release
      - name: Build both artifacts and assert their contents
        run: uv run pytest tests/release -q
      - name: Build
        run: uv build --out-dir "$RUNNER_TEMP/dist"
      - name: Metadata renders on the package index
        run: uv run twine check --strict "$RUNNER_TEMP"/dist/*
      - name: Install the wheel into clean environments and run the program
        run: uv run python scripts/verify_install.py "$RUNNER_TEMP"/dist/*.whl --python 3.10 --python 3.14

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.7"
          enable-cache: false
      - name: Export the locked runtime dependencies (core and extras, hashed)
        run: uv export --locked --no-dev --no-emit-project --all-extras --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
      - name: Known vulnerabilities in the locked versions (the locked tool, this interpreter, so marker-gated pins are audited)
        env:
          PYTHON: ${{ matrix.python }}
        run: uv run --locked --group release --python "$PYTHON" pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --strict
