[build-system]
# Exact pins, build backend and its dependencies: the build environment is created outside the lock
# file, so nothing here may float (docs/engineering/release.md, "Build backend").
requires = [
  "hatchling==1.32.4",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.7.0",
  "tomli==2.5.0; python_version < '3.11'",
  "tomlkit==0.15.1",
  "trove-classifiers==2026.9.21.13",
]
build-backend = "hatchling.build"

[project]
name = "datacopilot"
dynamic = ["version"]
description = "Headless dataset doctor: audit, convert and propose fixes for detection and classification datasets."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "DataCopilot contributors" }]
keywords = ["dataset", "audit", "computer-vision", "object-detection", "coco", "yolo", "cvat", "label-studio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1",
  "jinja2>=3.1",
  "numpy>=1.26",
  "pyarrow>=16",
  "pydantic>=2.7",
  "structlog>=24.1",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/B4teShai/DataCopilot"
Repository = "https://github.com/B4teShai/DataCopilot"
Issues = "https://github.com/B4teShai/DataCopilot/issues"
Changelog = "https://github.com/B4teShai/DataCopilot/blob/main/CHANGELOG.md"

[project.optional-dependencies]
embed = [
  # floors are the versions the suite and the real-model smoke tests were run with
  "pillow>=12.3",
  "safetensors>=0.8",
  "huggingface-hub>=2.2",
  "transformers>=5.19",
  "faiss-cpu>=1.15",
  "torch>=2.14",
]

[project.entry-points."datacopilot.formats"]
coco = "datacopilot.io.coco:plugin"
yolo = "datacopilot.io.yolo:plugin"
voc = "datacopilot.io.voc:plugin"
imagefolder = "datacopilot.io.imagefolder:plugin"
cvat_xml = "datacopilot.io.cvat:plugin"
label_studio = "datacopilot.io.labelstudio:plugin"

[project.entry-points."datacopilot.checks"]
boxes = "datacopilot.audit.checks.boxes:plugin"
duplicates = "datacopilot.audit.checks.duplicates:plugin"
imbalance = "datacopilot.audit.checks.imbalance:plugin"
integrity = "datacopilot.audit.checks.integrity:plugin"
leakage = "datacopilot.audit.checks.leakage:plugin"
near_duplicates = "datacopilot.audit.checks.near_duplicates:plugin"
outliers = "datacopilot.audit.checks.outliers:plugin"

[project.entry-points."datacopilot.embedders"]
hash = "datacopilot.embed.hashembed:plugin"
dinov2_small = "datacopilot.embed.backends:dinov2_small"
dinov2_base = "datacopilot.embed.backends:dinov2_base"
siglip2_base = "datacopilot.embed.backends:siglip2_base"

[project.scripts]
datacopilot = "datacopilot.cli.app:main"

[tool.hatch.version]
path = "src/datacopilot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/datacopilot"]

[tool.hatch.build.targets.sdist]
# an allow-list: tests, benchmarks, docs, plans, scripts, workflows and tool configuration stay out
include = [
  "/src/datacopilot",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/CHANGELOG.md",
  "/THIRD_PARTY_MODELS.md",
  "/pyproject.toml",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.100",
    "pillow>=12.3",
    "pyyaml>=6",
]
# documentation site (CI job `docs`); never part of the package or its extras
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "pymdown-extensions==12.3",
]
# release checks (CI jobs `package` and `audit`, tests/release); never part of the package
release = [
    "build==1.6.1",
    "twine==7.0.0",
    "pip-audit==2.10.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
# notebooks: imports sit next to the code they explain, and printed tables use long lines
"notebooks/**/*.ipynb" = ["E402", "E501"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not real_model'"
markers = [
  "chaos: interrupted-write and crash-recovery tests",
  "real_model: downloads real model weights and needs the [embed] extra (off by default; run with -m real_model)",
]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
